name: Create or Update Release on GitHub and WordPress

# A push to a release/** branch runs a dry run: it builds the plugin as WordPress.org
# would receive it and prints the SVN changes, without committing anything.
# A pushed v* tag (e.g. v2.1.4) publishes that version to WordPress.org for real.
on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release step needs it

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The tag, the plugin header and the readme's Stable tag must agree, and vendor/
      # must ship: the plugin loads vendor/autoload.php, and 2.1.0 went out without it.
      - name: Check version, stable tag and packaging
        id: version
        run: |
          HEADER=$(grep -m1 -E '^Version:' xmoney-crypto-for-woocommerce.php | awk '{print $2}' | tr -d '\r')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $3}' | tr -d '\r')
          echo "header=$HEADER stable=$STABLE ref=$GITHUB_REF_NAME"
          test -n "$HEADER"
          test "$HEADER" = "$STABLE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "${GITHUB_REF_NAME#v}" = "$HEADER"; fi
          test -f vendor/autoload.php
          if grep -qE '^/?vendor/?$' .distignore; then echo "vendor/ must ship"; exit 1; fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"

      # Ships the committed vendor/ as is (no composer install), so the package matches
      # what was tested. Dry run on release/** branches, real deploy on tags.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          dry-run: ${{ github.ref_type != 'tag' }}
        env:
          SLUG: utrust-for-woocommerce
          VERSION: ${{ steps.version.outputs.version }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Build ZIP archive
        if: github.ref_type == 'tag'
        run: |
          zip -r utrust-for-woocommerce.zip * -x .git .github composer.json composer.lock

      - name: Create GitHub release with the ZIP
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: utrust-for-woocommerce.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
